# Конфигурация Nginx для LeadHunter B2B (Telegram Bot & Mini App)
# Скопируйте в: /etc/nginx/sites-available/leadhunter.conf
# Активируйте: ln -s /etc/nginx/sites-available/leadhunter.conf /etc/nginx/sites-enabled/
# Выпустите SSL: certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com; # Укажите ваш домен

    # Логи
    access_log /var/log/nginx/leadhunter_access.log;
    error_log /var/log/nginx/leadhunter_error.log;

    # Максимальный размер загрузки
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Проксирование WebSocket и заголовков
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для длительных операций парсинга
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Отключение буферизации для мгновенного стриминга
        proxy_buffering off;
    }
}
