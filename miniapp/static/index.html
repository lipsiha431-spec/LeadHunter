<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LeadHunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* LeadHunter на телефоне — Mini App в Telegram. Мобильная версия окна программы: те же токены, стекло, карточки
   парсера, плашки Базы, лента «Сообщения», панель лида и живой фон (bg.js окна, настройки графики берутся с ПК).
   Данные — через /api с подписью initData; страница ничего не хранит, кроме своих фильтров. */
:root{
  color-scheme:dark;
  --bg:#080A10;
  --dens:1; --line:rgba(255,255,255,.09); --line2:rgba(0,240,255,.24);
  --ink:#F4F6FB; --ink2:#C8D0E0; --ink3:#828D9F;
  --c1:#00F0FF; --c2:#2A75FF; --c1-rgb:0,240,255; --c2-rgb:42,117,255;
  --hot:#00F0FF; --warm:#FFB800; --ok:#00FF88; --err:#FF4B55;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --sheet:cubic-bezier(.32,.72,0,1);
  --safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-b,0px)); --safe-t:var(--tg-safe-t,0px);
  --nav-h:62px;
  /* три уровня отступов: внутри элемента / между элементами / между разделами */
  --sp-in:8px; --sp-el:12px; --sp-sec:32px; --gut:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
::selection{background:rgba(var(--c1-rgb),.35)}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink3);opacity:.6}
.muted2{color:var(--ink3);margin-left:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* живой фон — свет за стеклом, а не обои: сверху виден, под контентом почти чёрный, у рейла снова проступает */
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,3,3,calc(.22*var(--dens))) 0,rgba(3,3,3,calc(.5*var(--dens))) 110px,rgba(3,3,3,calc(.76*var(--dens))) 220px,rgba(3,3,3,calc(.84*var(--dens))) 360px,rgba(3,3,3,calc(.84*var(--dens))) calc(100% - 220px),rgba(3,3,3,calc(.62*var(--dens))) 100%)}
.app{position:relative;z-index:1}

/* Иконки — те же, что в окне */
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:13px;height:13px;vertical-align:-2px}
.ic.star{width:13px;height:13px;fill:var(--warm);stroke:none}

/* ---- шапка ---- */
.top{position:sticky;top:0;z-index:5;padding:calc(10px + var(--safe-t)) var(--gut) 12px;background:linear-gradient(180deg,rgba(6,6,6,calc(.38*var(--dens))),rgba(6,6,6,calc(.62*var(--dens))));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:10px;min-height:34px}
.tb img{flex:none;width:34px;height:34px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 6px 18px -6px rgba(var(--c2-rgb),.55)}
.tb h1{margin:0;min-width:0;flex:1;font-size:24px;font-weight:720;letter-spacing:-.025em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb h1 small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;color:var(--ink3);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.sync{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 11px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;transition:transform .14s var(--ease-out),background-color .15s}
.sync:active{transform:scale(.96)}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(111,211,154,.16),0 0 8px rgba(111,211,154,.8)}
.sync .ic{width:14px;height:14px;color:var(--ink3)}
.sync.busy .ic{animation:sp .8s linear infinite}
.sync.busy .led{background:var(--warm);box-shadow:0 0 0 3px rgba(242,201,76,.16);animation:pulse 1s ease-in-out infinite}
.sync.off .led{background:var(--err);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
.sync.off{color:#FFC2C2;border-color:rgba(255,107,107,.35)}
@keyframes pulse{50%{opacity:.35}}
.searchbox{position:relative;margin-top:var(--sp-in)}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.input{width:100%;height:42px;padding:0 12px;background:rgba(0,0,0,.38);border:1px solid var(--line2);border-radius:10px;outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s,background-color .15s}
.input:focus-visible,.input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(var(--c1-rgb),.18)}
.input::placeholder{color:var(--ink3)}
.searchbox .input{padding-left:34px}
select.input{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.input option{background:#141414}
textarea.input{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}

main{padding:var(--sp-el) var(--gut) calc(var(--nav-h) + var(--sp-sec) + var(--safe-b))}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin:var(--sp-sec) 0 var(--sp-el);font-weight:600}
.hint{font-size:12.5px;line-height:1.5;color:var(--ink3);margin:6px 0 0;text-wrap:pretty}
.empty{padding:var(--sp-sec) 8px;text-align:center;color:var(--ink3);text-wrap:balance;line-height:1.5}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:var(--sp-in)}
.empty .btn{margin-top:var(--sp-el)}
.stats{margin:0 0 var(--sp-el);font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:var(--sp-el)}

/* ---- Liquid Glass кнопки (как в окне) ---- */
.btn{position:relative;isolation:isolate;overflow:hidden;min-height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;white-space:nowrap;text-decoration:none;
  color:var(--ink);background:rgba(255,255,255,.055);-webkit-backdrop-filter:blur(8px) saturate(170%);backdrop-filter:blur(8px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -10px 18px -12px rgba(255,255,255,.16),0 8px 24px -8px rgba(0,0,0,.55);
  transition:transform .16s var(--ease-out),background-color .2s var(--ease-out),box-shadow .2s var(--ease-out),opacity .2s;font-size:14px}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 46%)}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.btn.primary{
  font-weight:650;
  letter-spacing:0.02em;
  background:linear-gradient(135deg, #00D2FF 0%, #0066FF 100%) !important;
  color:#FFFFFF !important;
  border:1px solid rgba(255,255,255,.35) !important;
  box-shadow:0 6px 24px -4px rgba(0,180,255,.45), inset 0 1px 0 rgba(255,255,255,.55) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  border-radius:14px;
  transition:all .18s cubic-bezier(.2,.8,.2,1);
}
.btn.primary:active{
  transform:scale(0.985);
  box-shadow:0 2px 12px rgba(0,180,255,.6) !important;
}
.btn.danger{color:#FFC2C2;background:rgba(255,90,90,.07)}
.btn.wide{width:100%}
[aria-busy="true"]{pointer-events:none}
.btn[aria-busy="true"],.pill[aria-busy="true"],.mquick button[aria-busy="true"]{opacity:.75}
.btn[aria-busy="true"] .ic,.cbtn[aria-busy="true"] .ic,.hbtn[aria-busy="true"] .ic,.chbtn[aria-busy="true"] > .ic{opacity:0}
.btn[aria-busy="true"]::after,.cbtn[aria-busy="true"]::after,.hbtn[aria-busy="true"]::after,.chbtn[aria-busy="true"]::after,.pill[aria-busy="true"]::after,.mquick button[aria-busy="true"]::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:var(--ink);animation:sp .7s linear infinite;flex:none}
.cbtn[aria-busy="true"]::after,.hbtn[aria-busy="true"]::after{position:absolute;inset:0;margin:auto}
.chbtn[aria-busy="true"]::after{position:absolute;left:15px;top:50%;margin-top:-7px}
.btn[aria-busy="true"]::after{position:absolute;left:16px;top:50%;margin-top:-7px}
.dstat{display:block;min-height:16px;margin-top:4px;font-size:12px;color:var(--ink3)}
.dstat.ok{color:var(--ok)}
.dstat.err{color:var(--err)}
.btn .ic{width:16px;height:16px}
.btn:disabled{opacity:.4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 0;min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:2px;font-size:inherit}
.linkbtn:active{color:var(--c1)}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--ink);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- бейджи и значки (card-top окна) ---- */
.lead{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid}
.lead.hot{color:#FFB39E;background:rgba(255,122,89,.08);border-color:rgba(255,122,89,.24)}
.lead.warm{color:#F5DA8A;background:rgba(242,201,76,.07);border-color:rgba(242,201,76,.22)}
.lead.social{color:#D7B8FF;background:rgba(160,110,255,.08);border-color:rgba(160,110,255,.26)}
.lead.own{color:var(--ink2);background:rgba(255,255,255,.05);border-color:var(--line2)}
.lead.closedb{color:var(--ink3);background:rgba(255,255,255,.04);border-color:var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.hot{background:var(--hot);box-shadow:0 0 0 3px rgba(255,122,89,.16),0 0 10px rgba(255,122,89,.6)}
.dot.warm{background:var(--warm);box-shadow:0 0 0 3px rgba(242,201,76,.14),0 0 10px rgba(242,201,76,.45)}
.dot.social{background:#B68CFF;box-shadow:0 0 0 3px rgba(182,140,255,.15),0 0 10px rgba(182,140,255,.5)}
.dot.own{background:var(--ink3)}
.replied{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;white-space:nowrap;color:#BFE3FF;background:rgba(56,160,240,.14);border:1px solid rgba(56,160,240,.45)}
.replied .ic{width:12px;height:12px}
.sbadge{display:inline-flex;align-items:center;flex:none;max-width:110px;padding:2px 7px;border-radius:999px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#CDE8D2;background:rgba(80,190,120,.1);border:1px solid rgba(80,190,120,.38)}
.sbadge.warn{color:#FFE7A0;background:rgba(242,201,76,.1);border-color:rgba(242,201,76,.42)}
/* 3.10: бронь заведений — «Уже трогали» (лид у другого пользователя LeadHunter) */
.claim-plate{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;border-radius:10px;background:rgba(255,170,60,.12);border:1px solid rgba(255,170,60,.38);color:var(--ink);font-size:13px;line-height:1.35}
.claim-plate b{flex:none;font-weight:650}
.claim-plate span{min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.claim-plate.big{flex-direction:column;align-items:flex-start;gap:2px;margin-top:var(--sp-el);padding:12px 14px}
.claim-plate.big span{white-space:normal}
.card.claimed > :not(.claim-plate),.brow.claimed > :not(.claim-plate){opacity:.45}
.twin{display:inline-flex;align-items:center;gap:4px;flex:none;padding:2px 7px;border-radius:999px;font-size:11.5px;white-space:nowrap;color:#FFD7A0;background:rgba(242,170,60,.12);border:1px solid rgba(242,170,60,.4);font-variant-numeric:tabular-nums}
.card-rating{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2);flex:none}
.card-rating b{color:var(--ink);font-weight:600}
.dotsep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex:none;margin:0 3px}
.fu{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid;font-family:inherit;background:none}
.fu.over{color:#FFB0B0;background:rgba(255,80,80,.12);border-color:rgba(255,90,90,.4)}
.fu.due{color:#FFD7A0;background:rgba(242,170,60,.12);border-color:rgba(242,170,60,.4)}
.fu.soon{color:var(--ink2);background:rgba(255,255,255,.04);border-color:var(--line2)}
button.fu{min-height:34px;padding:0 12px;font-size:12.5px;transition:filter .15s var(--ease-out),transform .14s var(--ease-out)}
button.fu::after{content:"";flex:none;width:4px;height:4px;margin:-2px 1px 0 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);opacity:.7}
button.fu:active{transform:scale(.97)}
.card-next{margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;min-width:0}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.sdot.s-new{background:rgba(255,255,255,.35)}.sdot.s-queued{background:#3EE6A8}.sdot.s-contacted{background:var(--warm)}.sdot.s-interested{background:var(--ok)}
.sdot.s-declined{background:var(--ink3);opacity:.6}.sdot.s-client{background:var(--c1);box-shadow:0 0 8px var(--c1)}

/* кнопки каналов (contactCell) — на телефоне крупнее: палец, не курсор */
.cwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cbtn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--ink2);text-decoration:none;
  transition:transform .14s var(--ease-out),background-color .15s,border-color .15s,color .15s}
.cbtn .ic{width:19px;height:19px}
.cbtn:active{transform:scale(.92)}
.cbtn:disabled{opacity:.3}
.cbtn.ch-ig{color:#F58FB8;border-color:rgba(245,143,184,.3);background:rgba(225,48,108,.1)}
.cbtn.ch-tg{color:#7CC8F2;border-color:rgba(42,171,238,.3);background:rgba(42,171,238,.1)}
.cbtn.ch-viber{color:#B9A4F5;border-color:rgba(115,96,242,.32);background:rgba(115,96,242,.12)}
.cbtn.ch-wa{color:#7EDC9E;border-color:rgba(37,211,102,.28);background:rgba(37,211,102,.09)}
.cbtn.ch-fb{color:#8EB4F7;border-color:rgba(24,119,242,.3);background:rgba(24,119,242,.1)}
.cbtn.ghost{color:var(--ink3);opacity:.7;border-style:dashed}
.cbtn.unsure::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warm);box-shadow:0 0 0 2px #0a0a0a}
.cbtn.gen{color:var(--c1)}
.cbtn.gen.has{color:var(--ink2)}
.hbtn{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink2);padding:0;transition:transform .14s var(--ease-out),background-color .15s}
.hbtn .ic{width:16px;height:16px}
.hbtn:active{transform:scale(.92)}
.hbtn.on{color:#BFE3FF;border-color:rgba(56,160,240,.5);background:rgba(56,160,240,.14)}
.landline{font-size:12px;color:var(--ink3)}

/* ---- карточка парсера (cardHtml) ---- */
.card{position:relative;display:flex;flex-direction:column;gap:var(--sp-in);padding:14px 14px 12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(16,21,32,calc(.88*var(--dens))),rgba(10,13,20,calc(.94*var(--dens))));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -18px rgba(0,0,0,.95);
  transition:transform .18s var(--ease-out),border-color .18s,box-shadow .18s,opacity .2s}
.card:active{
  transform:scale(0.988);
  border-color:rgba(0,240,255,.45);
  box-shadow:0 0 18px rgba(0,240,255,.2);
}
.card:active{transform:scale(.99)}
.list > .card,.glist > .brow{content-visibility:auto;contain-intrinsic-size:auto 170px}
.card.s-declined{opacity:.5}
.card.s-client{border-color:rgba(var(--c1-rgb),.35)}
.card.active{border-color:rgba(var(--c1-rgb),.55);box-shadow:0 0 0 1px rgba(var(--c1-rgb),.25),0 16px 40px -18px rgba(var(--c2-rgb),.35)}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:24px}
.card-name{margin:0;font-size:16px;line-height:1.3;font-weight:650;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.card-city{margin:-6px 0 0;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink3);min-width:0;white-space:nowrap;overflow:hidden}
.card-city span{overflow:hidden;text-overflow:ellipsis}
.card-foot{margin-top:4px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(255,255,255,.06)}
.stat{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-size:12.5px;color:var(--ink2);white-space:nowrap;border:0;background:none;padding:0 8px;margin:0 -8px 0 0;border-radius:8px}
.stat::after{content:"";flex:none;width:5px;height:5px;margin:-3px 2px 0 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);opacity:.55}
.stat:active{background:rgba(255,255,255,.08)}

/* ---- плашка Базы (brow) ---- */
.brow{position:relative;display:flex;flex-direction:column;gap:var(--sp-in);min-width:0;padding:12px 14px 11px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(22,22,22,calc(.9*var(--dens))),rgba(12,12,12,calc(.92*var(--dens))));border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px -18px rgba(0,0,0,.9);transition:transform .18s var(--ease-out),border-color .18s}
.brow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.9}
.brow[data-lead]:active{transform:scale(.99)}
.brow.active{border-color:rgba(var(--c1-rgb),.55);box-shadow:0 0 0 1px rgba(var(--c1-rgb),.25)}
.brow.stopr{opacity:.7}
.bhead{display:flex;align-items:center;gap:8px;min-width:0;min-height:22px}
.bhead > b{flex:0 1 auto;min-width:0;font-size:15px;font-weight:650;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .card-rating{padding-left:4px}
.bmeta{margin-top:-6px;display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.bmeta > span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bmeta time{margin-left:auto;flex:none;font-size:11.5px;font-variant-numeric:tabular-nums}

/* «Сегодня» (baseToday, итоги) */

.kstrip{display:flex;margin:4px 0 var(--sp-el)}

.own-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.d-msg{white-space:pre-wrap;font-size:14px;line-height:1.55;color:var(--ink2);padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin:0;user-select:text;-webkit-user-select:text}
.them{margin:0;padding:10px 12px;border-radius:12px;background:rgba(56,160,240,.1);border:1px solid rgba(56,160,240,.3);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.them small{display:block;color:#BFE3FF;font-size:12px;margin-bottom:3px}
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.kv:first-child{border-top:0;padding-top:0}
.kv .ic.lead-ic{color:var(--ink3);width:17px;height:17px}
.kv .k{flex:1;min-width:0}
.kv .k b{display:block;font-weight:600;overflow-wrap:anywhere}
.kv .k small{display:block;color:var(--ink3);font-size:12.5px;overflow-wrap:anywhere;line-height:1.45}
.kv .v{flex:none;display:flex;gap:6px}
.kvlist{border-top:1px solid var(--line)}
.kvlist .kv:first-child{border-top:0;padding-top:10px}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.hist li{padding:6px 0;border-top:1px solid var(--line)}.hist li:first-child{border-top:0}
.hist small{color:var(--ink3);margin-right:6px;font-variant-numeric:tabular-nums}
.d-note{min-height:84px;font-size:16px}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .2s}
.saved.on{opacity:1}

/* ---- нижнее меню выбора (catmenu окна) ---- */
.pick{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .2s var(--ease-out),visibility 0s linear .2s}
.pick.open{opacity:1;visibility:visible;transition:opacity .2s var(--ease-out),visibility 0s}
.pick .box2{width:100%;max-height:82vh;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px calc(14px + var(--safe-b));border-radius:20px 20px 0 0;background:#121212;border-top:1px solid var(--line2);box-shadow:0 -20px 50px -12px rgba(0,0,0,.85);transform:translateY(100%);transition:transform .38s var(--sheet)}
.pick.open .box2{transform:none}
.grip{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 10px}
.pick h4{margin:0 4px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600}
.pick p{margin:6px 4px 10px;color:var(--ink2);font-size:13.5px;line-height:1.5;white-space:pre-line}
.opt-h{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:0;background:none;text-align:left;font-size:15px;color:var(--ink)}
.opt:active,.opt:focus-visible{background:rgba(255,255,255,.08);outline:none}
.opt[aria-current="true"]{background:rgba(255,255,255,.06)}
.opt small{margin-left:auto;color:var(--ink3);font-size:12.5px}
.opt i{flex:none;width:9px;height:9px;border-radius:50%}
.opt.pri{color:var(--c1);font-weight:600}
.opt.cancel{justify-content:center;color:var(--ink3);margin-top:4px;border-top:1px solid var(--line);border-radius:0}

.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 16px + var(--safe-b));z-index:45;display:flex;align-items:center;gap:12px;padding:11px 10px 11px 14px;border-radius:14px;
  background:rgba(16,16,16,.95);border:1px solid var(--line2);box-shadow:0 18px 50px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);font-size:13.5px;line-height:1.4;color:var(--ink);
  opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;transition:opacity .2s var(--ease-out),transform .25s var(--ease-out)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast.over{bottom:calc(16px + var(--safe-b))}
.toast > span{flex:1;min-width:0}
.toast-acts{display:flex;gap:6px;flex:none}
.toast-acts:empty{display:none}
.toast-act{background:rgba(var(--c1-rgb),.12);border:1px solid rgba(var(--c1-rgb),.3);color:var(--c1);border-radius:9px;padding:0 12px;height:34px;font-weight:600;font-size:13px;white-space:nowrap}

.view-in > *{animation:viewIn .24s var(--ease-out) both}
.view-in > :nth-child(2){animation-delay:30ms}.view-in > :nth-child(3){animation-delay:60ms}.view-in > :nth-child(4){animation-delay:90ms}.view-in > :nth-child(n+5){animation-delay:120ms}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.skel{height:118px;border-radius:14px;background:linear-gradient(90deg,rgba(20,20,20,.9) 0%,rgba(32,32,32,.9) 50%,rgba(20,20,20,.9) 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
.gate{position:relative;z-index:1;padding:80px 24px;text-align:center}
.gate img{width:72px;height:72px;border-radius:50%;margin-bottom:14px}
.gate b{display:block;font-size:19px;margin-bottom:6px}
.gate p{color:var(--ink3);line-height:1.5}
.scrim{display:none}
@media (min-width:720px){
  :root{--gut:24px}
  .list,.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
  .glist.wide{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .drawer{left:auto;width:min(480px,100%);border-left:1px solid var(--line2);box-shadow:-30px 0 60px -20px rgba(0,0,0,.8)}
  .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out)}
  .scrim.on{opacity:1;pointer-events:auto}
  .pick{justify-content:center}
  .pick .box2{max-width:520px;border-radius:20px 20px 0 0;border:1px solid var(--line2);border-bottom:0}
  .toast{left:50%;right:auto;width:min(560px,calc(100vw - 48px));transform:translate(-50%,10px) scale(.98)}
  .toast.show{transform:translate(-50%,0)}
  .top .searchbox{max-width:560px}
}
@media (min-width:1000px){
  :root{--nav-h:0px}
  .app{padding-left:80px}
  .rail{top:0;right:auto;width:80px;grid-template-columns:none;grid-auto-rows:62px;align-content:start;gap:4px;padding:calc(14px + var(--safe-t)) 8px;border-top:0;border-right:1px solid var(--line)}
  .rail-btn{height:62px}
  .rail-btn[aria-selected="true"]::before{top:16px;bottom:16px;left:-8px;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .rail-badge{top:7px;left:auto;right:10px}
  .toast{margin-left:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
// 3.1: страница на постоянном адресе («Телефон без компьютера») — сборка tools/mini-site подставляет { fn: адрес функции tg-login }.
// null — страницу отдаёт программа через туннель, как раньше.
const REMOTE = null; // rz-remote
const SNAP_V = 1;   // формат снимка, который эта страница понимает (bot.js rzrPut → "v")
// чужой родитель (Telegram Web) на обращение к window.parent.rzDev бросает SecurityError — весь скрипт падал
const DEV = (() => { try { return /[?&]dev\b/.test(location.search) && window.parent !== window && window.parent.rzDev; } catch { return null; } })();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nf = new Intl.NumberFormat('ru-RU');
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d > 1 && d < 5 ? b : d === 1 ? a : c; };
const CH = { ig: ['Instagram', 'ig'], tg: ['Telegram', 'tg'], viber: ['Viber', 'viber'], wa: ['WhatsApp', 'wa'], fb: ['Facebook', 'fb'] };
const STAGE_COLORS = { work: '#FFFFFF', new: '#8E8FA0', queued: '#3EE6A8', contacted: '#F2C94C', due: '#FF9F43', replied: '#38A0F0', interested: '#7EDC9E', client: '#B68CFF', declined: '#FF6B6B' };
const TITLES = { today: 'Сегодня', new: 'Парсер', base: 'База', msgs: 'Сообщения' };
const haptic = k => { try { k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : k === 'err' ? tg.HapticFeedback.notificationOccurred('error') : k === 'sel' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred('light'); } catch {} };

// ---- настройки страницы: облако Telegram (адрес туннеля меняется при каждом запуске программы — localStorage с ним пропадает) ----
const PREF_KEYS = ['tab', 'nf', 'sort', 'bf', 'fold', 'gfx'];
const P = { tab: 'today', nf: {}, sort: 'score', bf: 'work', fold: {}, gfx: null };
const cloud = () => { try { return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null; } catch { return null; } };
function prefsLoad(){
  return new Promise(done => {
    for (const k of PREF_KEYS) { try { const v = localStorage.getItem('rzm.' + k); if (v != null) P[k] = JSON.parse(v); } catch {} }
    const cs = cloud(); if (!cs) return done();
    const t = setTimeout(done, 700);
    try { cs.getItems(PREF_KEYS.map(k => 'rzm_' + k), (err, vals) => { clearTimeout(t); if (!err && vals) for (const k of PREF_KEYS) { try { const v = vals['rzm_' + k]; if (v) P[k] = JSON.parse(v); } catch {} } done(); }); } catch { clearTimeout(t); done(); }
  });
}
function keep(k, v){
  P[k] = v; const s = JSON.stringify(v);
  try { localStorage.setItem('rzm.' + k, s); } catch {}
  const cs = cloud(); if (cs && s.length < 4000) try { cs.setItem('rzm_' + k, s); } catch {}
}

// ---- живой фон окна: bg.js с ПК, настройки графики приходят с каждым ответом программы ----
let gfxLoaded = false;
function gfxBoot(){
  if (gfxLoaded) return; gfxLoaded = true;
  if (!DEV && P.gfx) try { localStorage.setItem('rz.settings', JSON.stringify({ gfx: P.gfx })); } catch {}
  const s = document.createElement('script'); s.src = '/static/bg.js'; s.onerror = () => { $('bg').hidden = true; };
  s.onload = () => { try { RZGfx.page(S.tab === 'base' ? 'base' : S.tab === 'msgs' ? 'msg' : 'lead'); } catch {} };
  document.body.appendChild(s);
}
function gfxApply(g){
  if (!g || DEV) return;

  toast('Запускаю поиск…', null, 30000);
  try { const d = await api('run', { city, cat }); const r = d.res || {}; haptic(r.ok === false ? 'err' : 'ok'); toast(r.msg || (r.ok ? 'Поиск запущен' : 'Поиск не запустился'), null, 9000); if (r.ok && !r.queued) runWatch(); }
  catch (e) { fail(e); }
}
let runT = 0;
function runWatch(){
  clearTimeout(runT);
  runT = setTimeout(async () => {
    let st; try { st = await api('runState'); } catch { return; }
    if (st.running) { toast(`Поиск · ${st.pct || 0}% — ${st.log || 'идёт'}`, null, 6000); runWatch(); }
    else if (st.log) { toast(st.log, null, 12000); if (S.tab === 'new' && !S.lead) show(true); }
  }, REMOTE ? 5000 : 3000);
}

// ---- нажатия ----
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,[data-lead]'); if (!t) return;
  if (t.matches('a[href^="tel:"]')) return;
  const d = t.dataset;
  if (t.id === 'sync') { haptic(); if (REMOTE) R.syncAt = 0; show(true); if (S.lead) refreshLead(); return; }   // постоянный адрес: и снимок перечитать сейчас
  if (d.tab) { if (t.classList.contains('rail-btn') && S.tab === d.tab && !S.q) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } haptic('sel'); setTab(d.tab); return; }
  if (t.hasAttribute('data-retry')) { show(); return; }
  if (t.hasAttribute('data-reopen')) { try { tg.close(); } catch {} return; }
  if (t.hasAttribute('data-close')) { closeLead(); return; }
  if (d.nav) { navLead(+d.nav); return; }
  if (d.ch) {
    const src = S.lead && S.lead.id === d.id && S.lead.data ? S.lead.data : S.items[d.id];
    if (src) contact(src, d.ch, !!d.owner, false, t); return;
  }
  if (d.stage) { stagePick(d.stage); return; }
  if (d.fu) { fuPick(d.fu); return; }
  if (d.mr) { const it = (S.lead && S.lead.id === d.mr && S.lead.data) || S.items[d.mr]; act(d.mr, 'mr', !(it && it.marked), t); return; }   // желаемое состояние: повтор не переключит назад
  if (d.gen) { flushDraft().then(() => act(d.gen, 'gen', null, t)); return; }
  if (d.quick) { flushDraft().then(() => act(d.id, 'quick', d.quick, t)); return; }
  if (d.callres) { S.callOpen = false; act(S.lead.id, 'call', d.callres); return; }
  if (d.blf) { haptic('sel'); if (d.blf !== P.bf) S.baseLim = 0; keep('bf', d.blf); if (S.tab !== 'base') setTab('base'); else show(); return; }
  if (t.hasAttribute('data-bmore') || t.hasAttribute('data-mmore')) {   // «Показать ещё» Базы / «Сообщений»: перечитать с бóльшим лимитом, прокрутка на месте
    // force: перерисовать и при фокусе в черновике; лимит запоминается, только если список вырос (ошибка — прежний)
    const bm = t.hasAttribute('data-bmore'), lim = { k: bm ? 'base' : 'msgs', n: (+d.shown || 0) + (bm ? 400 : 60) };
    // S.moreBusy — идёт показ по кнопке: таймер и возврат в приложение в это время свой тихий show не запускают
    // (новый show перебил бы этот по showSeq, и «ещё» не догрузилось бы)
    t.setAttribute('aria-busy', 'true'); haptic('sel'); S.moreBusy = (S.moreBusy || 0) + 1;
    flushDraft().then(() => show(true, true, lim)).catch(() => {}).finally(() => { S.moreBusy--; if (t.isConnected) t.removeAttribute('aria-busy'); });   // набранное в черновиках — сначала сохранить, перерисовка заменит поля
    return;
  }
  if (t.hasAttribute('data-queue')) { if (S.queue && S.queue.length) openLead(S.queue[0], { ids: S.queue.slice(), label: 'очередь' }); return; }
  if (t.hasAttribute('data-more')) { t.setAttribute('aria-busy', 'true'); viewNew(true).then(() => { const list = $('pList'); if (!list) return; const have = list.querySelectorAll('.card').length; list.insertAdjacentHTML('beforeend', S.parser.items.slice(have).map(pcard).join('')); $('pShown').textContent = nf.format(S.parser.items.length); t.removeAttribute('aria-busy'); const left = +t.dataset.left - (S.parser.items.length - have); t.dataset.left = left; if (left <= 0) t.parentNode.remove(); else t.innerHTML = icon('plus') + `Показать ещё ${Math.min(30, left)} из ${nf.format(left)}`; }).catch(e => { t.removeAttribute('aria-busy'); fail(e); }); return; }
  if (t.hasAttribute('data-pick-city')) {
    haptic('sel');
    const cities = S.cities || [];
    const allCities = ['Все города'].concat(cities.filter(c => c && c !== 'Все города'));
    const uniqueCities = Array.from(new Set(allCities));
    const curCity = P.nf.city || '';
    pick(
      'Город поиска',
      'Выберите город для фильтрации и подгрузки организаций',
      uniqueCities.map(c => ({
        label: c,
        cur: (c === 'Все города' && !curCity) || (c === curCity),
        fn: () => {
          keep('nf', Object.assign({}, P.nf, { city: c === 'Все города' ? '' : c }));
          haptic('sel');
          show();
        }
      }))
    );
    return;
  }
  if (t.hasAttribute('data-pick-sort')) {
    haptic('sel');
    const curSort = P.sort || 'score';
    pick(
      'Сортировка лидов',
      'Выберите порядок отображения карточек в списке',
      SORTS.map(([k, lab]) => ({
        label: lab,
        cur: k === curSort,
        fn: () => {
          keep('sort', k);
          haptic('sel');
          show();
        }
      }))
    );
    return;
  }
  if (t.hasAttribute('data-reset')) { haptic('sel'); keep('nf', {}); show(); return; }
  if (t.hasAttribute('data-run')) { runPick(t); return; }
  if (t.hasAttribute('data-clearq')) { S.q = ''; $('q').value = ''; show(); return; }
  if (d.kind != null) { haptic('sel'); keep('nf', Object.assign({}, P.nf, { kind: d.kind })); show(); return; }
  if (t.hasAttribute('data-mob')) { haptic('sel'); keep('nf', Object.assign({}, P.nf, { mob: !P.nf.mob })); show(); return; }
  if (d.grp) { const k = S.tab + '|' + d.grp, f = Object.assign({}, P.fold); f[k] = !isFolded(d.grp); keep('fold', f); haptic('sel'); show(true); return; }
  if (d.open) { openUrl(d.open); return; }
  if (d.copyv) { copy(d.copyv); return; }
  const L = S.lead && S.lead.data;
  if (d.copy && L) { const box = $('drawer').querySelector('[data-draft]'); const txt = (box && (box && box.value ? box.value.trim() : '')) ? box.value : L.textAny; if (!txt) toast('Копировать нечего: черновика нет, а первое сообщение уже уходило. Напишите текст или нажмите «Сгенерировать».'); else copy(txt, box && (box && box.value ? box.value.trim() : '') ? 'Черновик скопирован' : 'Шаблон скопирован'); return; }
  if (d.act && L) {
    const a = d.act;
    if (a === 'call') { S.callOpen = !S.callOpen; renderLeadKeep(); return; }
    if (a === 'stopPick') return pick('В стоп — почему?', 'Заведение уйдёт из списков. Вернуть можно в программе: База → Стоп.', L.stops.map(s => ({ label: s.label, fn: () => act(L.id, 'stop', s.id) })));
    if (a === 'sentPick') { const chs = L.links.length ? L.links.map(x => [x.ch, x.label]) : Object.entries(CH).map(([k, v]) => [k, v[0]]); return pick('Написал сам — где?', 'Касание запишется, как на компьютере: стадия «Жду ответа», дожим перенесётся.', chs.map(([ch, lab]) => ({ label: lab, fn: () => act(L.id, 'contact', { ch, text: !!L.text, copied: false, manual: true }) }))); }   // ничего не копировали — свой текст тоста
    act(L.id, a, d.arg, t); return;
  }
  if (d.lead && !e.target.closest('button:not([data-lead]),a,select,textarea,input')) {
    const inList = t.closest('#view');
    openLead(d.lead, inList ? { ids: listIds(), label: '' } : null);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-draft]')) { queueDraft(t.dataset.draft, t.value); return; }
  if (t.matches('[data-note]')) { notePend = { id: t.dataset.note, val: t.value }; unsentPut('n', t.dataset.note, t.value); clearTimeout(noteT); noteT = setTimeout(flushNote, 900); }
});
document.addEventListener('focusin', e => {
  if (e.target.matches('[readonly],[data-tmp]')) return;   // временное поле copyNow — не «печатают»
  if (refocusing && e.target.matches('textarea')) { document.body.classList.add('typing'); return; }   // вернули фокус после перерисовки панели — без прокрутки
  if (e.target.matches('textarea,input[type=search],input:not([type])')) { document.body.classList.add('typing'); setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250); }
});
document.addEventListener('focusout', e => { if (e.target.matches('textarea,input')) setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('textarea,input')) document.body.classList.remove('typing'); }, 60); });
document.addEventListener('focusout', e => { if (e.target.matches('[data-draft]')) saveDraft(e.target.dataset.draft); if (e.target.matches('[data-note]')) flushNote(); });
let qT = 0;
$('q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); window.scrollTo(0, 0); show(); }, 280); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('pick').classList.contains('open')) closePick(); else if (S.lead) closeLead(); } });
// панель: смахнуть влево/вправо — соседний лид, как стрелки в окне
(() => {
  let x0 = 0, y0 = 0, t0 = 0;
  $('drawer').addEventListener('touchstart', e => { if (e.touches.length !== 1 || e.target.closest('textarea,input')) { t0 = 0; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); }, { passive: true });
  $('drawer').addEventListener('touchend', e => {
    if (!t0 || Date.now() - t0 > 600) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 80 && Math.abs(dy) < 45) navLead(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
// высота шапки — для липких заголовков групп
const topH = () => document.documentElement.style.setProperty('--top-h', $('top').offsetHeight + 'px');
window.addEventListener('resize', topH);

// ---- запуск ----
(async function start(){
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor('#050505'); tg.setBackgroundColor && tg.setBackgroundColor('#030303'); tg.setBottomBarColor && tg.setBottomBarColor('#040404');
      if (tg.disableVerticalSwipes && tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();   // прокрутка вверх не сворачивает приложение
      tg.BackButton.onClick(() => { if ($('pick').classList.contains('open')) closePick(); else closeLead(); });
      const sa = () => { const s = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {}; document.documentElement.style.setProperty('--tg-safe-t', ((s.top || 0) + (c.top || 0)) + 'px'); document.documentElement.style.setProperty('--tg-safe-b', ((s.bottom || 0) + (c.bottom || 0)) + 'px'); topH(); };
      sa(); tg.onEvent && tg.onEvent('safeAreaChanged', sa); tg.onEvent && tg.onEvent('contentSafeAreaChanged', sa);
    } catch {}
  }
  // Universal browser and Telegram compatibility
  if (!tg || !tg.initData) {
    console.info('LeadHunter WebApp: Browser preview mode active');
  }
  await prefsLoad();
  if (REMOTE) {   // последний снимок и очередь — сразу, без сети
    try { const c = JSON.parse(localStorage.getItem('rzm.snap') || 'null'); if (c && c.snap) { R.snap = c.snap; R.srvAt = c.srvAt || ''; } } catch {}
    try { R.pend = JSON.parse(localStorage.getItem('rzm.pend') || '{}') || {}; for (const [k, p] of Object.entries(R.pend)) if (!p || Date.now() - (p.at || 0) > 7 * 864e5) delete R.pend[k]; } catch { R.pend = {}; }
    setInterval(() => { if (!document.hidden && Object.keys(R.pend).length && !R.syncP) remoteSync(true).catch(() => syncState('off')); }, 4000);
  }
  gfxBoot();
  topH();
  // ссылка из бота: ?l=<id> — сразу карточка, ?t=<вкладка> — раздел
  const u = new URLSearchParams(location.search);
  const tab = TITLES[u.get('t')] ? u.get('t') : P.tab;
  S.tab = TITLES[tab] ? tab : 'today';
  document.querySelectorAll('.rail-btn').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  show().catch(err => console.error('show init error:', err)).then(() => unsentResend());
  if (u.get('l')) openLead(u.get('l'), null);
  setInterval(() => {
    if (document.hidden || apiBusy || draftTyping() || $('pick').classList.contains('open') || document.body.classList.contains('typing') || S.q) return;
    if (S.lead) refreshLead(); else if (!S.moreBusy) show(true);
  }, 60000);
  // B4: свернули (ушли в чат, вызов) или закрывают — набранное уходит сейчас же, запрос переживает выгрузку (keepalive);
  // и лежит в localStorage до подтверждения программы
  const flushAll = () => { try { flushDraft().catch(() => {}); flushNote(); } catch {} };
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(toastT); flushAll(); return; } armToast(); if (draftTyping()) return; if (!S.lead) { if (!S.moreBusy) show(true); } else if (!$('drawer').contains(document.activeElement) || !document.activeElement.matches('textarea,input')) refreshLead(); });
})();
